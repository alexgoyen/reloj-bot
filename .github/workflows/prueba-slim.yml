name: prueba-slim
# Temporal: comprueba que el runner ubuntu-slim (más barato) sirve para el bot. Se borra después.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: README.md
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/x
          key: prueba-${{ github.run_id }}
          restore-keys: prueba-
      - run: |
          python --version && pip install -q requests cryptography tzdata && python -c "import requests, cryptography; print('ok', requests.get('https://api.elections.kalshi.com/trade-api/v2/exchange/status', timeout=20).status_code)"
          git --version && curl --version | head -1 && date -u
      - uses: actions/cache/save@v4
        with:
          path: README.md
          key: prueba-${{ github.run_id }}
