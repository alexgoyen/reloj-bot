name: reloj

# Lanza el workflow "bot.yml" de otro repositorio cada 30 minutos.
# Cada ejecución dura ~5,5 h (12 lanzamientos) y al terminar se encadena con la siguiente.
# El cron de abajo es solo un respaldo para reiniciar la cadena si alguna vez se corta.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "bucle = funcionamiento normal · prueba = lanza el bot una sola vez"
        type: choice
        options: [bucle, prueba]
        default: bucle
      espera:
        description: "Segundos de espera antes del primer lanzamiento"
        default: "0"
  schedule:
    - cron: "23 */3 * * *"

concurrency:
  group: reloj
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Lanzar el bot cada 30 minutos
        id: bucle
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_REPO: ${{ secrets.BOT_REPO }}
          MODO: ${{ inputs.modo || 'bucle' }}
          ESPERA: ${{ inputs.espera || '0' }}
        run: |
          set -uo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${BOT_REPO:-}" ]; then
            echo "::error::Faltan los secretos BOT_TOKEN o BOT_REPO"; exit 1
          fi
          lanzar() {
            code=$(curl -sS -o /tmp/r.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${BOT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${BOT_REPO}/actions/workflows/bot.yml/dispatches" \
              -d '{"ref":"main","inputs":{"command":"run"}}') || code=000
            if [ "$code" = "204" ]; then echo "$(date -u +%H:%MZ) lanzado"; return 0; fi
            echo "::warning::$(date -u +%H:%MZ) fallo al lanzar (HTTP $code): $(head -c 300 /tmp/r.txt 2>/dev/null)"
            return 1
          }
          if [ "$MODO" = "prueba" ]; then lanzar; exit $?; fi
          inicio=$(date +%s)   # el límite cuenta desde aquí, espera inicial incluida

          case "$ESPERA" in ''|*[!0-9]*) ESPERA=0 ;; esac
          [ "$ESPERA" -gt 1800 ] && ESPERA=1800
          [ "$ESPERA" -gt 0 ] && { echo "Espero ${ESPERA}s hasta el siguiente turno"; sleep "$ESPERA"; }

          fin=$(( inicio + 330*60 ))
          fallos=0
          while :; do
            if lanzar; then fallos=0; else fallos=$((fallos+1)); fi
            if [ "$fallos" -ge 3 ]; then echo "::error::3 fallos seguidos: revisa BOT_TOKEN"; exit 1; fi
            ultimo=$(date +%s)
            [ $(( ultimo + 1800 )) -gt "$fin" ] && break
            sleep 1800
          done
          resto=$(( ultimo + 1800 - $(date +%s) - 90 ))
          [ "$resto" -lt 0 ] && resto=0
          echo "espera=${resto}" >> "$GITHUB_OUTPUT"

      - name: Encadenar el siguiente turno
        if: success() && (inputs.modo || 'bucle') == 'bucle'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reloj.yml -R "$GITHUB_REPOSITORY" --ref main -f modo=bucle -f espera="${{ steps.bucle.outputs.espera }}"
